stages:
  - build
  - deploy

build_css:
  stage: build
  image: node:20-alpine
  script:
    - node scripts/build-css.mjs
  artifacts:
    paths:
      - dist/tokens.css
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

deploy_css:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build_css
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ci
        tr -d '\r' < ~/.ssh/id_ci > ~/.ssh/id_ci.tmp && mv ~/.ssh/id_ci.tmp ~/.ssh/id_ci
      elif [ -n "$SSH_PRIVATE_KEY" ]; then
        printf "%b" "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ci
      elif [ -n "$SSH_PRIVATE_KEY_B64" ]; then
        if [ -f "$SSH_PRIVATE_KEY_B64" ]; then
          B64_RAW="$(cat "$SSH_PRIVATE_KEY_B64")"
        else
          B64_RAW="$SSH_PRIVATE_KEY_B64"
        fi
        printf '%s' "$B64_RAW" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_ci
      else
        echo "ERROR: SSH key is not set. Provide SSH_PRIVATE_KEY or SSH_PRIVATE_KEY_B64."
        exit 1
      fi
    - grep -qE '^-----BEGIN (OPENSSH|RSA|EC) PRIVATE KEY-----$' ~/.ssh/id_ci
    - echo "CI key sha256:"
    - sha256sum ~/.ssh/id_ci | awk '{print $1}'
    - chmod 600 ~/.ssh/id_ci
    - test -s ~/.ssh/id_ci
    - ssh-keygen -y -f ~/.ssh/id_ci > ~/.ssh/id_ci.pub
    - echo "CI deploy key fingerprint:"
    - ssh-keygen -lf ~/.ssh/id_ci.pub
    - |
      if [ -n "$SSH_KNOWN_HOSTS" ]; then
        echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" > ~/.ssh/known_hosts
      fi
    - chmod 644 ~/.ssh/known_hosts
  script:
    - test -n "$SSH_HOST"
    - test -n "$SSH_USER"
    - test -n "$DEPLOY_PATH"
    - ssh -p "${SSH_PORT:-22}" -i ~/.ssh/id_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}" "echo ssh_ok"
    - rsync -avz -e "ssh -p ${SSH_PORT:-22} -i ~/.ssh/id_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" dist/tokens.css "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/tokens.css"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SSH_HOST && $SSH_USER && $DEPLOY_PATH && ($SSH_PRIVATE_KEY || $SSH_PRIVATE_KEY_B64)'
      when: on_success
