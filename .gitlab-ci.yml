stages:
  - build
  - deploy

build_css:
  stage: build
  image: node:20-alpine
  script:
    - node scripts/build-css.mjs
  artifacts:
    paths:
      - dist/tokens.css
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

deploy_css:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build_css
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      if [ -n "$SSH_KNOWN_HOSTS" ]; then
        echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" > ~/.ssh/known_hosts
      fi
    - chmod 644 ~/.ssh/known_hosts
  script:
    - test -n "$SSH_HOST"
    - test -n "$SSH_USER"
    - test -n "$DEPLOY_PATH"
    - rsync -avz -e "ssh -p ${SSH_PORT:-22}" dist/tokens.css "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/tokens.css"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SSH_HOST && $SSH_USER && $DEPLOY_PATH && $SSH_PRIVATE_KEY'
      when: on_success
