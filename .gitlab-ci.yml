stages:
  - publish

release_icons:
  stage: publish
  image: node:20-alpine
  script:
    - npm run publish:icons:web-package
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

deploy_tokens:
  stage: publish
  image: node:20-alpine
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      DEPLOY_SSH_KEY="${SSH_PRIVATE_KEY_APEX:-${SSH_PRIVATE_KEY_DEV:-${SSH_PRIVATE_KEY_DEPLOY:-${SSH_PRIVATE_KEY:-}}}}"
      if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
        echo "ERROR: SSH key is empty (expected SSH_PRIVATE_KEY_APEX, SSH_PRIVATE_KEY_DEV, SSH_PRIVATE_KEY_DEPLOY, or SSH_PRIVATE_KEY)."
        exit 1
      fi

      if [ -f "$DEPLOY_SSH_KEY" ]; then
        RAW_DEPLOY_SSH_KEY="$(cat "$DEPLOY_SSH_KEY")"
      else
        RAW_DEPLOY_SSH_KEY="$DEPLOY_SSH_KEY"
      fi

      TMP_SSH_KEY_FILE="$(mktemp)"
      printf '%b\n' "$RAW_DEPLOY_SSH_KEY" | tr -d '\r' > "$TMP_SSH_KEY_FILE"
      chmod 600 "$TMP_SSH_KEY_FILE"

      if ! head -n 1 "$TMP_SSH_KEY_FILE" | grep -Eq '^-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----$'; then
        echo "ERROR: SSH key format is invalid: missing BEGIN PRIVATE KEY header."
        rm -f "$TMP_SSH_KEY_FILE"
        exit 1
      fi

      ssh-add "$TMP_SSH_KEY_FILE"
      rm -f "$TMP_SSH_KEY_FILE"
    - |
      export SSH_HOST="${SSH_HOST_APEX:-${SERVER_IP_DEV:-${SSH_HOST:-${SERVER_IP:-}}}}"
      export SSH_USER="${SSH_USER:-www}"
      export TOKENS_DEPLOY_PATH="${TOKENS_DEPLOY_PATH:-/home/www/code/101-web-apex/dist/assets}"

      if [ -z "${SSH_HOST:-}" ]; then
        echo "ERROR: SSH host is empty (expected SSH_HOST_APEX, SERVER_IP_DEV, SSH_HOST, or SERVER_IP)."
        exit 1
      fi

      if [ -n "$SSH_KNOWN_HOSTS" ]; then
        echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" > ~/.ssh/known_hosts
      fi
    - chmod 644 ~/.ssh/known_hosts
  script:
    - npm run publish:tokens
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  environment:
    name: apex
    url: https://101-app.com/assets/tokens.css
    deployment_tier: production
    auto_stop_in: never
  after_script:
    - echo "Apex tokens updated - https://101-app.com/assets/tokens.css"
