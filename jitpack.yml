jdk:
  - openjdk17

install:
  - curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
  - echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  /tmp/gradle-8.9-bin.zip" | sha256sum -c -
  - unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
  - /tmp/gradle-8.9/bin/gradle :android:publishToMavenLocal --no-daemon
