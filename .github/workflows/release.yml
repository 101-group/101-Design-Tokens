name: Release Design Tokens

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish @101app/design-tokens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve next version
        run: |
          LATEST_VERSION="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [ -z "$LATEST_VERSION" ]; then
            VERSION="1.0.0"
          else
            MAJOR="$(printf '%s' "$LATEST_VERSION" | cut -d. -f1)"
            MINOR="$(printf '%s' "$LATEST_VERSION" | cut -d. -f2)"
            PATCH="$(printf '%s' "$LATEST_VERSION" | cut -d. -f3)"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Git tag already exists: $VERSION"
            exit 1
          fi
          echo "Resolved release version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@101app"

      - name: Check package contents
        env:
          DESIGN_TOKENS_PACKAGE_VERSION: ${{ env.VERSION }}
        run: npm run check:release

      - name: Validate npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Missing GitHub Actions secret: NPM_TOKEN"
            exit 1
          fi
          npm whoami --registry "https://registry.npmjs.org"

      - name: Check npm version
        run: |
          if npm view "@101app/design-tokens@$VERSION" version --registry "https://registry.npmjs.org" >/dev/null 2>&1; then
            echo "npm package version already exists: @101app/design-tokens@$VERSION"
            exit 1
          fi

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Publish package
        env:
          DESIGN_TOKENS_PACKAGE_VERSION: ${{ env.VERSION }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release:design-tokens
